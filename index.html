<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активные ивенты HolyWorld</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: #08090f;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 170, 0, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(170, 0, 255, 0.08) 0%, transparent 40%);
            color: #ffffff;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 30%, #ffaa00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 30px rgba(255, 170, 0, 0.2);
            text-align: center;
        }

        .status-bar {
            font-size: 13px;
            color: #6b729c;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 500;
        }

        /* Контейнер управления */
        .controls-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background: rgba(18, 20, 32, 0.6);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .refresh-btn {
            background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%);
            color: #fff;
            border: none;
            padding: 0 22px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            font-size: 14px;
            height: 42px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 153, 0, 0.5);
            filter: brightness(1.1);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .filter-select {
            background-color: #0f111e;
            color: #d1d5f0;
            border: 1px solid #282c47;
            padding: 0 38px 0 16px;
            border-radius: 10px;
            height: 42px;
            outline: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23ffaa00' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
        }

        .filter-select:hover, .filter-select:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 12px rgba(255, 170, 0, 0.2);
        }

        /* Таблица */
        .table-container {
            width: 100%;
            max-width: 950px;
            overflow: hidden;
            background: rgba(14, 16, 27, 0.7);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 16px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        th {
            background-color: rgba(9, 10, 18, 0.8);
            color: #5c6494;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        tr {
            transition: background 0.2s;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* Игровые плашки */
        .anarchy-badge {
            color: #ffaa00;
            font-weight: 700;
            background: rgba(255, 170, 0, 0.08);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 170, 0, 0.25);
            display: inline-block;
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        .rarity-badge {
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 8px;
            display: inline-block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .event-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .status-active {
            color: #00ff88;
            font-weight: 700;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 136, 0.08);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .status-pulse {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .loading, .error {
            text-align: center;
            padding: 40px;
            color: #6b729c;
            font-weight: 600;
        }

        .error {
            color: #ff4757;
        }

        /* Анимация при появлении строк */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>HOLYWORLD EVENTS</h1>
    <div id="status" class="status-bar">Синхронизация с сервером...</div>

    <div class="controls-container">
        <button class="refresh-btn" onclick="fetchEvents()">
            <span>🔄</span> Обновить
        </button>
        
        <select id="filter-name" class="filter-select" onchange="applyFilters()">
            <option value="">Все ивенты</option>
        </select>

        <select id="filter-rarity" class="filter-select" onchange="applyFilters()">
            <option value="">Вся редкость</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Анархия</th>
                    <th>Ивент</th>
                    <th>Редкость</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="events-list">
                <tr>
                    <td colspan="4" class="loading">Загрузка данных...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const RARITY_MAP = {
            'legendary': { name: 'Легендарный', color: '#ffaa00', priority: 100 },
            'легендарный': { name: 'Легендарный', color: '#ffaa00', priority: 100 },
            'mythic': { name: 'Мифический', color: '#ff55ff', priority: 90 },
            'мифический': { name: 'Мифический', color: '#ff55ff', priority: 90 },
            
            'ship_roskoshni_f': { name: 'Роскошный', color: '#e040fb', priority: 80 },
            'roskoshniy': { name: 'Роскошный', color: '#e040fb', priority: 80 },
            'роскошный': { name: 'Роскошный', color: '#e040fb', priority: 80 },
            
            'epic': { name: 'Эпический', color: '#b347ff', priority: 70 },
            'эпический': { name: 'Эпический', color: '#b347ff', priority: 70 },
            
            'rare': { name: 'Редкий', color: '#00e5ff', priority: 60 },
            'rare_plains': { name: 'Редкий (Равнина)', color: '#00e5ff', priority: 60 },
            'rare_desert': { name: 'Редкий (Пустыня)', color: '#00e5ff', priority: 60 },
            'редкий': { name: 'Редкий', color: '#00e5ff', priority: 60 },
            
            'explosive': { name: 'Взрывной', color: '#ff3366', priority: 50 },
            'peaceful': { name: 'Мирный', color: '#00ff88', priority: 40 },
            
            'default': { name: 'Обычный', color: '#9098be', priority: 10 },
            'normal': { name: 'Обычный', color: '#9098be', priority: 10 },
            'normal_plains': { name: 'Обычный (Равнина)', color: '#9098be', priority: 10 },
            'normal_desert': { name: 'Обычный (Пустыня)', color: '#9098be', priority: 10 },
            'ship_default': { name: 'Обычный', color: '#9098be', priority: 10 },
            'ship_default_f': { name: 'Обычный', color: '#9098be', priority: 10 },
            'обычный': { name: 'Обычный', color: '#9098be', priority: 10 }
        };

        let rawEventsList = [];

        function parseRarity(rawRarity) {
            if (!rawRarity) return { name: 'Обычный', color: '#9098be', priority: 10 };
            const key = rawRarity.toString().toLowerCase();
            return RARITY_MAP[key] || { name: rawRarity, color: '#ffffff', priority: 20 };
        }

        function formatServerName(serverKey) {
            const numMatch = serverKey.match(/\d+/);
            const num = numMatch ? numMatch[0] : '';
            
            if (serverKey.startsWith('LITE_NEW_ANARCHY')) {
                return `Lite (Новая) №${num}`;
            } else if (serverKey.startsWith('LITE_ANARCHY')) {
                return `Lite №${num}`;
            } else if (serverKey.startsWith('GRIEF_ANARCHY')) {
                return `Grief №${num}`;
            }
            return serverKey;
        }

        async function fetchEvents() {
            const tbody = document.getElementById('events-list');
            const statusEl = document.getElementById('status');
            
            const savedSelectedName = document.getElementById('filter-name').value;
            const savedSelectedRarity = document.getElementById('filter-rarity').value;

            tbody.innerHTML = '<tr><td colspan="4" class="loading">Загрузка активных ивентов...</td></tr>';

            const proxies = [
                url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            const targetUrl = 'https://api.holyworld.me/v1/events';
            let data = null;

            for (let proxy of proxies) {
                try {
                    const res = await fetch(proxy(targetUrl));
                    if (res.ok) {
                        data = await res.json();
                        break;
                    }
                } catch (e) {
                    console.warn('Прокси не ответил...');
                }
            }

            if (!data) {
                statusEl.innerText = 'Ошибка подключения к серверам HolyWorld';
                tbody.innerHTML = '<tr><td colspan="4" class="error">Не удалось загрузить данные. Проверьте соединение.</td></tr>';
                return;
            }

            statusEl.innerText = `Последнее обновление: ${new Date().toLocaleTimeString('ru-RU')}`;
            rawEventsList = [];

            Object.keys(data).forEach(serverKey => {
                const eventList = data[serverKey];
                if (Array.isArray(eventList)) {
                    eventList.forEach(event => {
                        const displayName = event.metadata?.displayName || event.name || event.title;
                        if (!displayName) return;

                        const rarityInfo = parseRarity(event.metadata?.rare);

                        rawEventsList.push({
                            serverKey,
                            serverFormatted: formatServerName(serverKey),
                            serverNum: parseInt(serverKey.match(/\d+/)?.[0] || 0),
                            displayName,
                            rarityName: rarityInfo.name,
                            rarityColor: rarityInfo.color,
                            rarityPriority: rarityInfo.priority
                        });
                    });
                }
            });

            rawEventsList.sort((a, b) => {
                if (b.rarityPriority !== a.rarityPriority) {
                    return b.rarityPriority - a.rarityPriority;
                }
                return a.serverNum - b.serverNum;
            });

            updateFilterOptions(savedSelectedName, savedSelectedRarity);
            applyFilters();
        }

        function updateFilterOptions(targetName, targetRarity) {
            const nameSelect = document.getElementById('filter-name');
            const raritySelect = document.getElementById('filter-rarity');

            const namesSet = new Set();
            const raritySet = new Set();

            rawEventsList.forEach(item => {
                namesSet.add(item.displayName);
                raritySet.add(item.rarityName);
            });

            nameSelect.innerHTML = '<option value="">Все ивенты</option>';
            Array.from(namesSet).sort().forEach(name => {
                const isSelected = (name === targetName) ? 'selected' : '';
                nameSelect.innerHTML += `<option value="${name}" ${isSelected}>${name}</option>`;
            });

            raritySelect.innerHTML = '<option value="">Вся редкость</option>';
            Array.from(raritySet).sort().forEach(rarity => {
                const isSelected = (rarity === targetRarity) ? 'selected' : '';
                raritySelect.innerHTML += `<option value="${rarity}" ${isSelected}>${rarity}</option>`;
            });
        }

        function applyFilters() {
            const selectedName = document.getElementById('filter-name').value;
            const selectedRarity = document.getElementById('filter-rarity').value;

            const filtered = rawEventsList.filter(item => {
                const matchesName = !selectedName || item.displayName === selectedName;
                const matchesRarity = !selectedRarity || item.rarityName === selectedRarity;
                return matchesName && matchesRarity;
            });

            renderTable(filtered);
        }

        function renderTable(events) {
            const tbody = document.getElementById('events-list');
            tbody.innerHTML = '';

            if (events.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="loading">Нет активных ивентов по фильтру.</td></tr>';
                return;
            }

            events.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'fade-in';
                row.innerHTML = `
                    <td><span class="anarchy-badge">${item.serverFormatted}</span></td>
                    <td><span class="event-name">${item.displayName}</span></td>
                    <td>
                        <span class="rarity-badge" style="color: ${item.rarityColor}; background: ${item.rarityColor}12; border: 1px solid ${item.rarityColor}40; box-shadow: 0 0 12px ${item.rarityColor}20;">
                            ${item.rarityName}
                        </span>
                    </td>
                    <td>
                        <span class="status-active">
                            <span class="status-pulse"></span> Идёт сейчас
                        </span>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        fetchEvents();
    </script>
</body>
</html>
