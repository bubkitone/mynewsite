<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HolyWorld Live Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #ffaa00;
            --accent-glow: rgba(255, 170, 0, 0.2);
            --bg-glow: rgba(255, 170, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 11, 18, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: #222640;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        body {
            background: #090a10;
            color: #ffffff;
            padding: 40px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .bg-aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 0%, var(--bg-glow) 0%, transparent 60%);
            transition: background 0.5s ease;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .status-bar {
            font-size: 13px;
            color: #5d648c;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }

        .controls-container {
            display: flex;
            gap: 14px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background: rgba(18, 20, 32, 0.75);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 100;
        }

        .events-counter {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--accent-glow);
            padding: 0 16px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #d1d5f0;
        }

        .events-counter .count-num {
            color: var(--accent-color);
            font-weight: 800;
            font-size: 15px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, var(--accent-color) 0%, rgba(210, 110, 0, 0.9) 100%);
            color: #000;
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 800;
            font-size: 13px;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .refresh-btn svg {
            fill: #000;
            transition: transform 0.4s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .refresh-btn:hover svg {
            transform: rotate(180deg);
        }

        /* Кастомный дропдаун */
        .custom-dropdown {
            position: relative;
            min-width: 220px;
        }

        .dropdown-selected {
            background-color: #0d0f18;
            color: #d1d5f0;
            border: 1px solid #232742;
            padding: 0 16px;
            border-radius: 12px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .dropdown-selected:hover, .custom-dropdown.active .dropdown-selected {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
            color: #ffffff;
        }

        .dropdown-arrow {
            fill: #7c85b1;
            transition: transform 0.3s ease;
        }

        .custom-dropdown.active .dropdown-arrow {
            transform: rotate(180deg);
            fill: var(--accent-color);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #0d0f18;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 2px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 200;
        }

        .custom-dropdown.active .dropdown-menu {
            display: flex;
            animation: fadeIn 0.2s ease forwards;
        }

        .dropdown-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #a3aacd;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .dropdown-item.selected {
            background: rgba(255, 170, 0, 0.15);
            color: var(--accent-color);
            font-weight: 700;
        }

        .item-badge {
            background: rgba(255, 255, 255, 0.06);
            color: #7c85b1;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
        }

        .dropdown-item:hover .item-badge, .dropdown-item.selected .item-badge {
            background: var(--accent-color);
            color: #000000;
        }

        .table-container {
            width: 100%;
            max-width: 960px;
            overflow: hidden;
            background: rgba(14, 16, 27, 0.8);
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            position: relative;
            z-index: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 16px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        th {
            background-color: rgba(9, 10, 16, 0.9);
            color: #555c82;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .anarchy-badge {
            color: var(--accent-color);
            font-weight: 800;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--accent-glow);
            display: inline-block;
            font-size: 13px;
        }

        .rarity-badge {
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 8px;
            display: inline-block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .event-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .status-active {
            color: #00ff88;
            font-weight: 700;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 136, 0.06);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
        }

        .loading, .error {
            text-align: center;
            padding: 40px;
            color: #555c82;
            font-weight: 700;
        }

        .error {
            color: #ff3366;
        }

        .fade-in {
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-aurora"></div>

    <h1>HolyWorld Events</h1>
    <div id="status" class="status-bar">Подключение к API...</div>

    <div class="controls-container">
        <div class="events-counter">
            <span>Активных:</span>
            <span id="counter-value" class="count-num">0</span>
        </div>

        <button class="refresh-btn" onclick="fetchEvents()">
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            Обновить
        </button>
        
        <div class="custom-dropdown" id="dropdown-name">
            <div class="dropdown-selected" onclick="toggleDropdown('dropdown-name')">
                <span class="selected-text">Все ивенты</span>
                <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
            <div class="dropdown-menu"></div>
        </div>

        <div class="custom-dropdown" id="dropdown-rarity">
            <div class="dropdown-selected" onclick="toggleDropdown('dropdown-rarity')">
                <span class="selected-text">Вся редкость</span>
                <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
            <div class="dropdown-menu"></div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Анархия</th>
                    <th>Ивент</th>
                    <th>Редкость</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="events-list">
                <tr>
                    <td colspan="4" class="loading">Загрузка активных событий...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const RARITY_MAP = {
            'legendary': { name: 'Легендарный', color: '#ffaa00', priority: 100 },
            'легендарный': { name: 'Легендарный', color: '#ffaa00', priority: 100 },
            'mythic': { name: 'Мифический', color: '#ff55ff', priority: 90 },
            'мифический': { name: 'Мифический', color: '#ff55ff', priority: 90 },
            
            'ship_roskoshni_f': { name: 'Роскошный', color: '#e040fb', priority: 80 },
            'roskoshniy': { name: 'Роскошный', color: '#e040fb', priority: 80 },
            'роскошный': { name: 'Роскошный', color: '#e040fb', priority: 80 },
            
            'epic': { name: 'Эпический', color: '#b347ff', priority: 70 },
            'эпический': { name: 'Эпический', color: '#b347ff', priority: 70 },
            
            'rare': { name: 'Редкий', color: '#00e5ff', priority: 60 },
            'rare_plains': { name: 'Редкий (Равнина)', color: '#00e5ff', priority: 60 },
            'rare_desert': { name: 'Редкий (Пустыня)', color: '#00e5ff', priority: 60 },
            'редкий': { name: 'Редкий', color: '#00e5ff', priority: 60 },
            
            'explosive': { name: 'Взрывной', color: '#ff3366', priority: 50 },
            'peaceful': { name: 'Мирный', color: '#00ff88', priority: 40 },
            
            'default': { name: 'Обычный', color: '#7c85b1', priority: 10 },
            'normal': { name: 'Обычный', color: '#7c85b1', priority: 10 },
            'normal_plains': { name: 'Обычный (Равнина)', color: '#7c85b1', priority: 10 },
            'normal_desert': { name: 'Обычный (Пустыня)', color: '#7c85b1', priority: 10 },
            'ship_default': { name: 'Обычный', color: '#7c85b1', priority: 10 },
            'ship_default_f': { name: 'Обычный', color: '#7c85b1', priority: 10 },
            'обычный': { name: 'Обычный', color: '#7c85b1', priority: 10 }
        };

        const EVENT_THEMES = {
            'Таинственный корабль': '#00e5ff',
            'Золотая лихорадка': '#ffaa00',
            'Ценный груз': '#ff3366',
            'Смертельная шахта': '#b347ff',
            'Цветочная поляна': '#ff55ff',
            'Контейнер': '#00ff88'
        };

        let rawEventsList = [];
        let selectedNameVal = '';
        let selectedRarityVal = '';

        function parseRarity(rawRarity) {
            if (!rawRarity) return { name: 'Обычный', color: '#7c85b1', priority: 10 };
            const key = rawRarity.toString().toLowerCase();
            return RARITY_MAP[key] || { name: rawRarity, color: '#ffffff', priority: 20 };
        }

        function formatServerName(serverKey) {
            const numMatch = serverKey.match(/\d+/);
            const num = numMatch ? numMatch[0] : '';
            
            if (serverKey.startsWith('LITE_NEW_ANARCHY')) {
                return `Lite (Новая) №${num}`;
            } else if (serverKey.startsWith('LITE_ANARCHY')) {
                return `Lite №${num}`;
            } else if (serverKey.startsWith('GRIEF_ANARCHY')) {
                return `Grief №${num}`;
            }
            return serverKey;
        }

        // --- Определение, активен ли ивент прямо сейчас ---
        // API не задокументирован публично, поэтому проверяем сразу
        // все распространённые варианты полей активности/окончания.
        // Если ни одного признака "неактивности" не найдено — считаем ивент активным.
        function isEventActive(event) {
            if (!event) return false;

            // 1. Явные булевы флаги
            if (event.active === false) return false;
            if (event.isActive === false) return false;
            if (event.enabled === false) return false;
            if (event.finished === true) return false;
            if (event.expired === true) return false;
            if (event.ended === true) return false;

            // 2. Текстовый статус
            const statusRaw = (event.status || event.state || event.metadata?.status || '')
                .toString()
                .toLowerCase();
            const inactiveStatuses = ['ended', 'end', 'expired', 'finished', 'inactive', 'closed', 'stopped', 'completed', 'done', 'завершен', 'завершён', 'неактивен'];
            if (statusRaw && inactiveStatuses.includes(statusRaw)) return false;

            // 3. Временные метки окончания (мс или сек, ISO-строка)
            const endCandidates = [
                event.endTime, event.endsAt, event.expiresAt, event.expireAt,
                event.finishTime, event.finishesAt, event.timeEnd, event.end,
                event.metadata?.endTime, event.metadata?.expiresAt, event.metadata?.timeEnd
            ];
            for (const raw of endCandidates) {
                if (raw === undefined || raw === null || raw === '') continue;
                let ts = typeof raw === 'number' ? raw : Date.parse(raw);
                if (!isNaN(ts)) {
                    if (ts < 10000000000) ts *= 1000; // секунды -> мс
                    if (ts <= Date.now()) return false;
                }
            }

            // 4. Оставшееся время (если <= 0 — ивент уже закончился)
            const remainingCandidates = [
                event.timeLeft, event.remainingTime, event.secondsLeft,
                event.metadata?.timeLeft, event.metadata?.remainingTime
            ];
            for (const rem of remainingCandidates) {
                if (typeof rem === 'number' && rem <= 0) return false;
            }

            return true;
        }

        function toggleDropdown(id) {
            const el = document.getElementById(id);
            const isActive = el.classList.contains('active');
            
            closeAllDropdowns();
            if (!isActive) el.classList.add('active');
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.custom-dropdown').forEach(d => d.classList.remove('active'));
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-dropdown')) {
                closeAllDropdowns();
            }
        });

        async function fetchJSON(url) {
            const res = await fetch(url, {
                cache: 'no-store',
                headers: { 'Accept': 'application/json' }
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        async function fetchEvents() {
            const tbody = document.getElementById('events-list');
            const statusEl = document.getElementById('status');

            tbody.innerHTML = '<tr><td colspan="4" class="loading">Обновление списка ивентов...</td></tr>';

            // Метка времени "ломает" любое кеширование — и в браузере, и на прокси,
            // которые иначе могут отдавать старый снимок вместо актуального.
            const targetUrl = `https://api.holyworld.me/v1/events?_=${Date.now()}`;

            // Запросы напрямую + через прокси для надежности (прокси — только на случай CORS-сбоя)
            const fetchMethods = [
                { label: 'напрямую', run: () => fetchJSON(targetUrl) },
                { label: 'corsproxy.io', run: () => fetchJSON(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`) },
                { label: 'allorigins.win', run: () => fetchJSON(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`) }
            ];

            let data = null;
            let usedMethod = null;

            for (const method of fetchMethods) {
                try {
                    data = await method.run();
                    usedMethod = method.label;
                    break;
                } catch (e) {
                    console.warn(`[${method.label}] сбой запроса:`, e.message);
                }
            }

            if (!data) {
                statusEl.innerText = 'Ошибка загрузки данных';
                tbody.innerHTML = '<tr><td colspan="4" class="error">Не удалось получить данные с сервера HolyWorld (проверьте консоль браузера).</td></tr>';
                document.getElementById('counter-value').innerText = '0';
                return;
            }

            // Диагностика: сколько всего событий вернул API до фильтрации по активности
            const rawTotal = Object.values(data).reduce((sum, arr) => sum + (Array.isArray(arr) ? arr.length : 0), 0);
            console.log(`[HolyWorld] источник: ${usedMethod}, серверов с данными: ${Object.keys(data).length}, событий в сыром ответе: ${rawTotal}`);

            statusEl.innerText = `Обновлено: ${new Date().toLocaleTimeString('ru-RU')} · источник: ${usedMethod} · в ответе API: ${rawTotal}`;
            rawEventsList = [];

            // Обрабатываем ТОЛЬКО активные в текущий момент ивенты
            Object.keys(data).forEach(serverKey => {
                const eventList = data[serverKey];
                if (Array.isArray(eventList)) {
                    eventList.forEach(event => {
                        // Пропускаем неактивные/завершённые ивенты
                        if (!isEventActive(event)) return;

                        const displayName = event.metadata?.displayName || event.name || event.title;
                        if (!displayName) return;

                        const rarityInfo = parseRarity(event.metadata?.rare);

                        rawEventsList.push({
                            serverKey,
                            serverFormatted: formatServerName(serverKey),
                            serverNum: parseInt(serverKey.match(/\d+/)?.[0] || 0),
                            displayName,
                            rarityName: rarityInfo.name,
                            rarityColor: rarityInfo.color,
                            rarityPriority: rarityInfo.priority
                        });
                    });
                }
            });

            // Сортируем: сверху наиболее редкие
            rawEventsList.sort((a, b) => {
                if (b.rarityPriority !== a.rarityPriority) {
                    return b.rarityPriority - a.rarityPriority;
                }
                return a.serverNum - b.serverNum;
            });

            updateDropdownMenus();
            applyFilters();
        }

        function updateDropdownMenus() {
            const nameCounts = {};
            const rarityCounts = {};

            rawEventsList.forEach(item => {
                nameCounts[item.displayName] = (nameCounts[item.displayName] || 0) + 1;
                rarityCounts[item.rarityName] = (rarityCounts[item.rarityName] || 0) + 1;
            });

            // Если выбранное имя/редкость больше не встречаются среди активных ивентов — сбрасываем фильтр
            if (selectedNameVal && !nameCounts[selectedNameVal]) {
                selectedNameVal = '';
                document.querySelector('#dropdown-name .selected-text').innerText = 'Все ивенты';
            }
            if (selectedRarityVal && !rarityCounts[selectedRarityVal]) {
                selectedRarityVal = '';
                document.querySelector('#dropdown-rarity .selected-text').innerText = 'Вся редкость';
            }

            const nameMenu = document.querySelector('#dropdown-name .dropdown-menu');
            let nameHTML = `<div class="dropdown-item ${selectedNameVal === '' ? 'selected' : ''}" onclick="selectFilter('name', '')">
                <span>Все ивенты</span>
                <span class="item-badge">${rawEventsList.length}</span>
            </div>`;

            Object.keys(nameCounts).sort().forEach(name => {
                const isSelected = selectedNameVal === name ? 'selected' : '';
                nameHTML += `<div class="dropdown-item ${isSelected}" onclick="selectFilter('name', '${name}')">
                    <span>${name}</span>
                    <span class="item-badge">${nameCounts[name]}</span>
                </div>`;
            });
            nameMenu.innerHTML = nameHTML;

            const rarityMenu = document.querySelector('#dropdown-rarity .dropdown-menu');
            let rarityHTML = `<div class="dropdown-item ${selectedRarityVal === '' ? 'selected' : ''}" onclick="selectFilter('rarity', '')">
                <span>Вся редкость</span>
                <span class="item-badge">${rawEventsList.length}</span>
            </div>`;

            Object.keys(rarityCounts).sort().forEach(rarity => {
                const isSelected = selectedRarityVal === rarity ? 'selected' : '';
                rarityHTML += `<div class="dropdown-item ${isSelected}" onclick="selectFilter('rarity', '${rarity}')">
                    <span>${rarity}</span>
                    <span class="item-badge">${rarityCounts[rarity]}</span>
                </div>`;
            });
            rarityMenu.innerHTML = rarityHTML;
        }

        function selectFilter(type, value) {
            if (type === 'name') {
                selectedNameVal = value;
                document.querySelector('#dropdown-name .selected-text').innerText = value || 'Все ивенты';
            } else if (type === 'rarity') {
                selectedRarityVal = value;
                document.querySelector('#dropdown-rarity .selected-text').innerText = value || 'Вся редкость';
            }

            closeAllDropdowns();
            updateDropdownMenus();
            applyFilters();
        }

        function applyFilters() {
            updateDynamicTheme(selectedNameVal, selectedRarityVal);

            const filtered = rawEventsList.filter(item => {
                const matchesName = !selectedNameVal || item.displayName === selectedNameVal;
                const matchesRarity = !selectedRarityVal || item.rarityName === selectedRarityVal;
                return matchesName && matchesRarity;
            });

            const counterEl = document.getElementById('counter-value');
            if (filtered.length === rawEventsList.length) {
                counterEl.innerText = rawEventsList.length;
            } else {
                counterEl.innerText = `${filtered.length} / ${rawEventsList.length}`;
            }

            renderTable(filtered);
        }

        function updateDynamicTheme(selectedName, selectedRarity) {
            let activeColor = '#ffaa00';

            if (selectedRarity) {
                const rarityObj = Object.values(RARITY_MAP).find(r => r.name === selectedRarity);
                if (rarityObj) activeColor = rarityObj.color;
            } else if (selectedName && EVENT_THEMES[selectedName]) {
                activeColor = EVENT_THEMES[selectedName];
            }

            document.documentElement.style.setProperty('--accent-color', activeColor);
            document.documentElement.style.setProperty('--accent-glow', activeColor + '35');
            document.documentElement.style.setProperty('--bg-glow', activeColor + '12');
        }

        function renderTable(events) {
            const tbody = document.getElementById('events-list');
            tbody.innerHTML = '';

            if (events.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="loading">Прямо сейчас нет активных ивентов с выбранными параметрами.</td></tr>';
                return;
            }

            events.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'fade-in';
                row.innerHTML = `
                    <td><span class="anarchy-badge">${item.serverFormatted}</span></td>
                    <td><span class="event-name">${item.displayName}</span></td>
                    <td>
                        <span class="rarity-badge" style="color: ${item.rarityColor}; background: ${item.rarityColor}12; border: 1px solid ${item.rarityColor}40;">
                            ${item.rarityName}
                        </span>
                    </td>
                    <td>
                        <span class="status-active">
                            <span class="status-dot"></span> Активен
                        </span>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Автообновление каждые 15 секунд, чтобы список ивентов
        // быстрее отражал изменения (появление/окончание)
        setInterval(fetchEvents, 15000);

        fetchEvents();
    </script>
</body>
</html>
