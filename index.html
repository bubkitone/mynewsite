<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активные ивенты HolyWorld</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            color: #ffaa00;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
        }

        .refresh-btn {
            background-color: #2b2f42;
            color: #fff;
            border: 1px solid #444b6e;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background-color: #3b405a;
        }

        .table-container {
            width: 100%;
            max-width: 900px;
            overflow-x: auto;
            background: #181b29;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2b2f42;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid #2b2f42;
        }

        th {
            background-color: #121420;
            color: #8a8fbd;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #1f2335;
        }

        .rarity-badge {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            display: inline-block;
        }

        .loading, .error {
            text-align: center;
            padding: 20px;
            color: #8a8fbd;
        }

        .error {
            color: #ff5555;
        }

        .anarchy-num {
            color: #ffaa00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Активные ивенты HolyWorld</h1>
    <button class="refresh-btn" onclick="fetchEvents()">🔄 Обновить список</button>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Анархия</th>
                    <th>Название ивента</th>
                    <th>Редкость</th>
                    <th>Время (Начало / Конец)</th>
                </tr>
            </thead>
            <tbody id="events-list">
                <tr>
                    <td colspan="4" class="loading">Загрузка ивентов...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Цвета под популярные категории и редкости ивентов
        const RARITY_COLORS = {
            'common': '#aaaaaa',
            'uncommon': '#55ff55',
            'rare': '#55ffff',
            'epic': '#aa00aa',
            'legendary': '#ffaa00',
            'mythic': '#ff55ff',
            'обычный': '#aaaaaa',
            'редкий': '#55ffff',
            'эпический': '#aa00aa',
            'легендарный': '#ffaa00'
        };

        function formatDate(timestamp) {
            if (!timestamp) return '—';
            const date = new Date(timestamp);
            return date.toLocaleString('ru-RU', {
                hour: '2-digit',
                minute: '2-digit',
                day: '2-digit',
                month: '2-digit'
            });
        }

        function getRarityColor(rarity) {
            if (!rarity) return '#ffffff';
            const key = rarity.toString().toLowerCase();
            return RARITY_COLORS[key] || '#ffffff';
        }

        async function fetchEvents() {
            const tbody = document.getElementById('events-list');
            tbody.innerHTML = '<tr><td colspan="4" class="loading">Загрузка ивентов...</td></tr>';

            // Используем публичный CORS-прокси для обхода блокировки
            const proxyUrl = 'https://api.allorigins.win/raw?url=';
            const apiUrl = 'https://api.holyworld.me/v1/events';

            try {
                const response = await fetch(proxyUrl + encodeURIComponent(apiUrl));
                if (!response.ok) throw new Error('Ошибка HTTP: ' + response.status);
                
                const data = await response.json();
                
                // Извлекаем ивенты из возможной структуры
                const events = Array.isArray(data) ? data : (data.events || data.result || []);

                if (events.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="loading">На данный момент активных ивентов нет.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';

                events.forEach((event) => {
                    const row = document.createElement('tr');

                    // Поля с возможными названиями ключей из API HolyWorld
                    const anarchy = event.anarchy || event.server || event.subserver || event.anarchyNumber || '—';
                    const name = event.name || event.title || event.eventName || 'Без названия';
                    const rarity = event.rarity || event.type || null;
                    const startTime = event.startTime || event.start_time || event.startedAt;
                    const endTime = event.endTime || event.end_time || event.endsAt;

                    const rarityColor = getRarityColor(rarity);

                    row.innerHTML = `
                        <td class="anarchy-num">№ ${anarchy}</td>
                        <td><strong>${name}</strong></td>
                        <td>
                            ${rarity ? `<span class="rarity-badge" style="color: ${rarityColor}; border: 1px solid ${rarityColor}44;">${rarity}</span>` : '—'}
                        </td>
                        <td>${formatDate(startTime)} / ${formatDate(endTime)}</td>
                    `;

                    tbody.appendChild(row);
                });

            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="4" class="error">Не удалось загрузить данные (${err.message})</td></tr>`;
            }
        }

        // Загрузка при открытии и автообновление раз в 30 секунд
        fetchEvents();
        setInterval(fetchEvents, 30000);
    </script>
</body>
</html>
