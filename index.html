<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активные ивенты HolyWorld</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            color: #ffaa00;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
            text-align: center;
        }

        .status-bar {
            font-size: 13px;
            color: #8a8fbd;
            margin-bottom: 20px;
            text-align: center;
        }

        .refresh-btn {
            background-color: #2b2f42;
            color: #fff;
            border: 1px solid #444b6e;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .refresh-btn:hover {
            background-color: #3b405a;
            border-color: #ffaa00;
        }

        .table-container {
            width: 100%;
            max-width: 850px;
            overflow-x: auto;
            background: #181b29;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2b2f42;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid #2b2f42;
        }

        th {
            background-color: #121420;
            color: #8a8fbd;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #1f2335;
        }

        .anarchy-badge {
            color: #ffaa00;
            font-weight: bold;
            background: rgba(255, 170, 0, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 170, 0, 0.3);
            display: inline-block;
        }

        .rarity-badge {
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            display: inline-block;
            font-size: 13px;
            text-transform: capitalize;
        }

        .status-active {
            color: #55ff55;
            font-weight: bold;
            font-size: 13px;
        }

        .loading, .error {
            text-align: center;
            padding: 30px;
            color: #8a8fbd;
        }

        .error {
            color: #ff5555;
        }
    </style>
</head>
<body>

    <h1>Активные ивенты HolyWorld</h1>
    <button class="refresh-btn" onclick="fetchEvents()">🔄 Обновить список</button>
    <div id="status" class="status-bar">Загрузка...</div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Анархия</th>
                    <th>Название ивента</th>
                    <th>Редкость</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="events-list">
                <tr>
                    <td colspan="4" class="loading">Получение данных...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Таблица цветов под все редкости API HolyWorld
        const RARITY_COLORS = {
            'normal': '#aaaaaa',
            'обычный': '#aaaaaa',
            'default': '#aaaaaa',
            'normal_plains': '#55ff55',
            'normal_desert': '#55ff55',
            'rare': '#55ffff',
            'rare_plains': '#55ffff',
            'rare_desert': '#55ffff',
            'редкий': '#55ffff',
            'epic': '#aa00aa',
            'эпический': '#aa00aa',
            'legendary': '#ffaa00',
            'легендарный': '#ffaa00',
            'mythic': '#ff55ff',
            'мифический': '#ff55ff',
            'explosive': '#ff5555',
            'peaceful': '#55ff55'
        };

        // Форматирование названий серверов (LITE_ANARCHY_32 -> Lite №32)
        function formatServerName(serverKey) {
            const numMatch = serverKey.match(/\d+/);
            const num = numMatch ? numMatch[0] : '';
            
            if (serverKey.startsWith('LITE_NEW_ANARCHY')) {
                return `Lite (Новая) №${num}`;
            } else if (serverKey.startsWith('LITE_ANARCHY')) {
                return `Lite №${num}`;
            } else if (serverKey.startsWith('GRIEF_ANARCHY')) {
                return `Grief №${num}`;
            }
            return serverKey;
        }

        function getRarityColor(rarity) {
            if (!rarity) return '#ffffff';
            const key = rarity.toString().toLowerCase();
            return RARITY_COLORS[key] || '#ffffff';
        }

        async function fetchEvents() {
            const tbody = document.getElementById('events-list');
            const statusEl = document.getElementById('status');
            tbody.innerHTML = '<tr><td colspan="4" class="loading">Загрузка ивентов...</td></tr>';

            // Набор CORS-прокси на случай блокировок
            const proxies = [
                url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            const targetUrl = 'https://api.holyworld.me/v1/events';
            let data = null;

            for (let proxy of proxies) {
                try {
                    const res = await fetch(proxy(targetUrl));
                    if (res.ok) {
                        data = await res.json();
                        break;
                    }
                } catch (e) {
                    console.warn('Прокси не ответил, пробуем следующий...');
                }
            }

            if (!data) {
                statusEl.innerText = 'Не удалось подключиться к API HolyWorld';
                tbody.innerHTML = '<tr><td colspan="4" class="error">Ошибка загрузки данных. Попробуйте обновить позже.</td></tr>';
                return;
            }

            statusEl.innerText = `Последнее обновление: ${new Date().toLocaleTimeString('ru-RU')}`;
            tbody.innerHTML = '';

            let hasEvents = false;

            // Сортируем серверы по номеру анархии для удобства
            const servers = Object.keys(data).sort((a, b) => {
                const numA = parseInt(a.match(/\d+/)?.[0] || 0);
                const numB = parseInt(b.match(/\d+/)?.[0] || 0);
                return numA - numB;
            });

            servers.forEach(serverKey => {
                const eventList = data[serverKey];
                
                if (Array.isArray(eventList) && eventList.length > 0) {
                    eventList.forEach(event => {
                        hasEvents = true;
                        const row = document.createElement('tr');

                        const serverName = formatServerName(serverKey);
                        const displayName = event.metadata?.displayName || event.id || 'Неизвестный ивент';
                        const rarity = event.metadata?.rare || 'Обычный';
                        const rarityColor = getRarityColor(rarity);

                        row.innerHTML = `
                            <td><span class="anarchy-badge">${serverName}</span></td>
                            <td><strong>${displayName}</strong></td>
                            <td>
                                <span class="rarity-badge" style="color: ${rarityColor}; border: 1px solid ${rarityColor}55;">
                                    ${rarity}
                                </span>
                            </td>
                            <td><span class="status-active">🟢 Идёт сейчас</span></td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            });

            if (!hasEvents) {
                tbody.innerHTML = '<tr><td colspan="4" class="loading">В данный момент нет активных ивентов.</td></tr>';
            }
        }

        // Автозапуск и обновление каждые 15 секунд
        fetchEvents();
        setInterval(fetchEvents, 15000);
    </script>
</body>
</html>
