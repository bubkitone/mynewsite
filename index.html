<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активные ивенты HolyWorld</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            color: #ffaa00;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
            text-align: center;
        }

        .status-bar {
            font-size: 13px;
            color: #8a8fbd;
            margin-bottom: 15px;
            text-align: center;
        }

        .controls-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .refresh-btn {
            background-color: #2b2f42;
            color: #fff;
            border: 1px solid #444b6e;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            height: 40px;
        }

        .refresh-btn:hover {
            background-color: #3b405a;
            border-color: #ffaa00;
        }

        .filter-select {
            background-color: #181b29;
            color: #ffffff;
            border: 1px solid #444b6e;
            padding: 0 14px;
            border-radius: 8px;
            height: 40px;
            outline: none;
            cursor: pointer;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .filter-select:hover, .filter-select:focus {
            border-color: #ffaa00;
        }

        .table-container {
            width: 100%;
            max-width: 900px;
            overflow-x: auto;
            background: #181b29;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2b2f42;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid #2b2f42;
        }

        th {
            background-color: #121420;
            color: #8a8fbd;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #1f2335;
        }

        .anarchy-badge {
            color: #ffaa00;
            font-weight: bold;
            background: rgba(255, 170, 0, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 170, 0, 0.3);
            display: inline-block;
        }

        .rarity-badge {
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            display: inline-block;
            font-size: 13px;
        }

        .status-active {
            color: #55ff55;
            font-weight: bold;
            font-size: 13px;
        }

        .loading, .error {
            text-align: center;
            padding: 30px;
            color: #8a8fbd;
        }

        .error {
            color: #ff5555;
        }
    </style>
</head>
<body>

    <h1>Активные ивенты HolyWorld</h1>
    <div id="status" class="status-bar">Загрузка...</div>

    <div class="controls-container">
        <button class="refresh-btn" onclick="fetchEvents()">🔄 Обновить список</button>
        
        <select id="filter-name" class="filter-select" onchange="applyFilters()">
            <option value="">Все ивенты</option>
        </select>

        <select id="filter-rarity" class="filter-select" onchange="applyFilters()">
            <option value="">Вся редкость</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Анархия</th>
                    <th>Название ивента</th>
                    <th>Редкость</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="events-list">
                <tr>
                    <td colspan="4" class="loading">Получение данных...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const RARITY_MAP = {
            'legendary': { name: 'Легендарный', color: '#ffaa00', priority: 100 },
            'легендарный': { name: 'Легендарный', color: '#ffaa00', priority: 100 },
            'mythic': { name: 'Мифический', color: '#ff55ff', priority: 90 },
            'мифический': { name: 'Мифический', color: '#ff55ff', priority: 90 },
            
            'ship_roskoshni_f': { name: 'Роскошный', color: '#e040fb', priority: 80 },
            'roskoshniy': { name: 'Роскошный', color: '#e040fb', priority: 80 },
            'роскошный': { name: 'Роскошный', color: '#e040fb', priority: 80 },
            
            'epic': { name: 'Эпический', color: '#aa00aa', priority: 70 },
            'эпический': { name: 'Эпический', color: '#aa00aa', priority: 70 },
            
            'rare': { name: 'Редкий', color: '#55ffff', priority: 60 },
            'rare_plains': { name: 'Редкий (Равнина)', color: '#55ffff', priority: 60 },
            'rare_desert': { name: 'Редкий (Пустыня)', color: '#55ffff', priority: 60 },
            'редкий': { name: 'Редкий', color: '#55ffff', priority: 60 },
            
            'explosive': { name: 'Взрывной', color: '#ff5555', priority: 50 },
            'peaceful': { name: 'Мирный', color: '#55ff55', priority: 40 },
            
            'default': { name: 'Обычный', color: '#aaaaaa', priority: 10 },
            'normal': { name: 'Обычный', color: '#aaaaaa', priority: 10 },
            'normal_plains': { name: 'Обычный (Равнина)', color: '#aaaaaa', priority: 10 },
            'normal_desert': { name: 'Обычный (Пустыня)', color: '#aaaaaa', priority: 10 },
            'ship_default': { name: 'Обычный', color: '#aaaaaa', priority: 10 },
            'ship_default_f': { name: 'Обычный', color: '#aaaaaa', priority: 10 },
            'обычный': { name: 'Обычный', color: '#aaaaaa', priority: 10 }
        };

        let rawEventsList = [];

        function parseRarity(rawRarity) {
            if (!rawRarity) return { name: 'Обычный', color: '#aaaaaa', priority: 10 };
            const key = rawRarity.toString().toLowerCase();
            return RARITY_MAP[key] || { name: rawRarity, color: '#ffffff', priority: 20 };
        }

        function formatServerName(serverKey) {
            const numMatch = serverKey.match(/\d+/);
            const num = numMatch ? numMatch[0] : '';
            
            if (serverKey.startsWith('LITE_NEW_ANARCHY')) {
                return `Lite (Новая) №${num}`;
            } else if (serverKey.startsWith('LITE_ANARCHY')) {
                return `Lite №${num}`;
            } else if (serverKey.startsWith('GRIEF_ANARCHY')) {
                return `Grief №${num}`;
            }
            return serverKey;
        }

        async function fetchEvents() {
            const tbody = document.getElementById('events-list');
            const statusEl = document.getElementById('status');
            
            // Запоминаем текущий выбор пользователя перед очисткой таблицы
            const savedSelectedName = document.getElementById('filter-name').value;
            const savedSelectedRarity = document.getElementById('filter-rarity').value;

            tbody.innerHTML = '<tr><td colspan="4" class="loading">Загрузка ивентов...</td></tr>';

            const proxies = [
                url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            const targetUrl = 'https://api.holyworld.me/v1/events';
            let data = null;

            for (let proxy of proxies) {
                try {
                    const res = await fetch(proxy(targetUrl));
                    if (res.ok) {
                        data = await res.json();
                        break;
                    }
                } catch (e) {
                    console.warn('Прокси не ответил...');
                }
            }

            if (!data) {
                statusEl.innerText = 'Ошибка подключения к API';
                tbody.innerHTML = '<tr><td colspan="4" class="error">Не удалось получить данные с сервера.</td></tr>';
                return;
            }

            statusEl.innerText = `Обновлено: ${new Date().toLocaleTimeString('ru-RU')}`;
            rawEventsList = [];

            Object.keys(data).forEach(serverKey => {
                const eventList = data[serverKey];
                if (Array.isArray(eventList)) {
                    eventList.forEach(event => {
                        const displayName = event.metadata?.displayName || event.name || event.title;
                        if (!displayName) return;

                        const rarityInfo = parseRarity(event.metadata?.rare);

                        rawEventsList.push({
                            serverKey,
                            serverFormatted: formatServerName(serverKey),
                            serverNum: parseInt(serverKey.match(/\d+/)?.[0] || 0),
                            displayName,
                            rarityName: rarityInfo.name,
                            rarityColor: rarityInfo.color,
                            rarityPriority: rarityInfo.priority
                        });
                    });
                }
            });

            // Сортировка по редкости (высокий приоритет вверху)
            rawEventsList.sort((a, b) => {
                if (b.rarityPriority !== a.rarityPriority) {
                    return b.rarityPriority - a.rarityPriority;
                }
                return a.serverNum - b.serverNum;
            });

            // Обновляем варианты в списках и восстанавливаем выбор
            updateFilterOptions(savedSelectedName, savedSelectedRarity);
            
            // Фильтруем данные по сохранённому выбору
            applyFilters();
        }

        function updateFilterOptions(targetName, targetRarity) {
            const nameSelect = document.getElementById('filter-name');
            const raritySelect = document.getElementById('filter-rarity');

            const namesSet = new Set();
            const raritySet = new Set();

            rawEventsList.forEach(item => {
                namesSet.add(item.displayName);
                raritySet.add(item.rarityName);
            });

            // Пересобираем ивенты, восстанавливая выбранный опшн (если он есть в новом ответе API)
            nameSelect.innerHTML = '<option value="">Все ивенты</option>';
            Array.from(namesSet).sort().forEach(name => {
                const isSelected = (name === targetName) ? 'selected' : '';
                nameSelect.innerHTML += `<option value="${name}" ${isSelected}>${name}</option>`;
            });

            // Пересобираем редкость, восстанавливая выбранный опшн
            raritySelect.innerHTML = '<option value="">Вся редкость</option>';
            Array.from(raritySet).sort().forEach(rarity => {
                const isSelected = (rarity === targetRarity) ? 'selected' : '';
                raritySelect.innerHTML += `<option value="${rarity}" ${isSelected}>${rarity}</option>`;
            });
        }

        function applyFilters() {
            const selectedName = document.getElementById('filter-name').value;
            const selectedRarity = document.getElementById('filter-rarity').value;

            const filtered = rawEventsList.filter(item => {
                const matchesName = !selectedName || item.displayName === selectedName;
                const matchesRarity = !selectedRarity || item.rarityName === selectedRarity;
                return matchesName && matchesRarity;
            });

            renderTable(filtered);
        }

        function renderTable(events) {
            const tbody = document.getElementById('events-list');
            tbody.innerHTML = '';

            if (events.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="loading">Нет ивентов по выбранным фильтрам.</td></tr>';
                return;
            }

            events.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="anarchy-badge">${item.serverFormatted}</span></td>
                    <td><strong>${item.displayName}</strong></td>
                    <td>
                        <span class="rarity-badge" style="color: ${item.rarityColor}; border: 1px solid ${item.rarityColor}55;">
                            ${item.rarityName}
                        </span>
                    </td>
                    <td><span class="status-active">🟢 Идёт сейчас</span></td>
                `;
                tbody.appendChild(row);
            });
        }

        fetchEvents();
    </script>
</body>
</html>
