<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активные ивенты HolyWorld</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            color: #ffaa00;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .refresh-btn {
            background-color: #2b2f42;
            color: #fff;
            border: 1px solid #444b6e;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background-color: #3b405a;
        }

        .status {
            font-size: 13px;
            color: #8a8fbd;
            margin-bottom: 15px;
        }

        .table-container {
            width: 100%;
            max-width: 900px;
            overflow-x: auto;
            background: #181b29;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2b2f42;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid #2b2f42;
        }

        th {
            background-color: #121420;
            color: #8a8fbd;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #1f2335;
        }

        .rarity-badge {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            display: inline-block;
            text-transform: capitalize;
        }

        .anarchy-badge {
            color: #ffaa00;
            font-weight: bold;
            background: rgba(255, 170, 0, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 170, 0, 0.3);
        }

        .loading, .error {
            text-align: center;
            padding: 20px;
            color: #8a8fbd;
        }

        .error {
            color: #ff5555;
        }

        /* Окно отладки (скрыто по умолчанию, нужно если API вернул неизвестный формат) */
        #debug {
            margin-top: 20px;
            width: 100%;
            max-width: 900px;
            background: #121420;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            color: #55ff55;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Активные ивенты HolyWorld</h1>
    
    <div class="controls">
        <button class="refresh-btn" onclick="fetchEvents()">🔄 Обновить список</button>
        <button class="refresh-btn" onclick="toggleDebug()">🐞 Переключить отладку</button>
    </div>

    <div id="status-text" class="status">Готов к загрузке...</div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Анархия</th>
                    <th>Название ивента</th>
                    <th>Редкость</th>
                    <th>Время (Начало / Конец)</th>
                </tr>
            </thead>
            <tbody id="events-list">
                <tr>
                    <td colspan="4" class="loading">Загрузка ивентов...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <pre id="debug"></pre>

    <script>
        // Список резервных CORS-прокси на случай блокировки
        const PROXIES = [
            (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
        ];

        // Карта цветов редкостей
        const RARITY_COLORS = {
            'common': '#aaaaaa',
            'uncommon': '#55ff55',
            'rare': '#55ffff',
            'epic': '#aa00aa',
            'legendary': '#ffaa00',
            'mythic': '#ff55ff',
            'обычный': '#aaaaaa',
            'редкий': '#55ffff',
            'эпический': '#aa00aa',
            'легендарный': '#ffaa00'
        };

        function formatDate(timestamp) {
            if (!timestamp) return '—';
            // Если пришли секунды вместо миллисекунд
            if (typeof timestamp === 'number' && timestamp < 10000000000) {
                timestamp *= 1000;
            }
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) return timestamp; // fallback
            return date.toLocaleString('ru-RU', {
                hour: '2-digit',
                minute: '2-digit',
                day: '2-digit',
                month: '2-digit'
            });
        }

        function getRarityColor(rarity) {
            if (!rarity) return '#ffffff';
            const key = rarity.toString().toLowerCase();
            return RARITY_COLORS[key] || '#ffffff';
        }

        // Преобразование кода сервера (напр. LITE_ANARCHY_40 -> №40 Lite)
        function formatServerName(serverRaw) {
            if (!serverRaw) return '—';
            let str = serverRaw.toString();
            const match = str.match(/\d+/);
            const num = match ? match[0] : '';

            if (str.toUpperCase().includes('LITE')) return `№ ${num} (Lite)`;
            if (str.toUpperCase().includes('GRIEF')) return `№ ${num} (Grief)`;
            if (num) return `№ ${num}`;
            return str;
        }

        function toggleDebug() {
            const debugEl = document.getElementById('debug');
            debugEl.style.display = debugEl.style.display === 'none' ? 'block' : 'none';
        }

        async function fetchWithFallback(targetUrl) {
            const statusEl = document.getElementById('status-text');
            
            for (let i = 0; i < PROXIES.length; i++) {
                const proxiedUrl = PROXIES[i](targetUrl);
                try {
                    statusEl.innerText = `Подключение к API (Попытка ${i + 1})...`;
                    const res = await fetch(proxiedUrl);
                    if (res.ok) {
                        return await res.json();
                    }
                } catch (e) {
                    console.warn(`Прокси ${i + 1} не ответил:`, e);
                }
            }
            throw new Error('Все прокси-серверы недоступны или заблокированы');
        }

        async function fetchEvents() {
            const tbody = document.getElementById('events-list');
            const statusEl = document.getElementById('status-text');
            const debugEl = document.getElementById('debug');

            tbody.innerHTML = '<tr><td colspan="4" class="loading">Загрузка данных...</td></tr>';

            try {
                const targetUrl = 'https://api.holyworld.me/v1/events';
                const data = await fetchWithFallback(targetUrl);
                
                statusEl.innerText = `Успешно обновлено в ${new Date().toLocaleTimeString()}`;
                debugEl.innerText = JSON.stringify(data, null, 2);

                // Извлечение массива ивентов из разной возможной структуры JSON
                let events = [];
                if (Array.isArray(data)) {
                    events = data;
                } else if (typeof data === 'object' && data !== null) {
                    events = data.events || data.result || data.data || [];
                    // Если API возвращает объект с серверами в качестве ключей
                    if (events.length === 0 && !data.error) {
                        for (const key in data) {
                            if (Array.isArray(data[key])) {
                                data[key].forEach(e => events.push({...e, server: e.server || key}));
                            }
                        }
                    }
                }

                if (events.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="loading">Сейчас нет активных ивентов.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';

                events.forEach((event) => {
                    const row = document.createElement('tr');

                    const serverRaw = event.server || event.anarchy || event.subserver || event.serverName || '—';
                    const anarchyFormatted = formatServerName(serverRaw);
                    
                    const name = event.name || event.title || event.eventName || 'Ивент';
                    const rarity = event.rarity || event.type || null;
                    
                    const startTime = event.startTime || event.start_time || event.startedAt;
                    const endTime = event.endTime || event.end_time || event.endsAt;

                    const rarityColor = getRarityColor(rarity);

                    row.innerHTML = `
                        <td><span class="anarchy-badge">${anarchyFormatted}</span></td>
                        <td><strong>${name}</strong></td>
                        <td>
                            ${rarity ? `<span class="rarity-badge" style="color: ${rarityColor}; border: 1px solid ${rarityColor}55;">${rarity}</span>` : '—'}
                        </td>
                        <td>${formatDate(startTime)} / ${formatDate(endTime)}</td>
                    `;

                    tbody.appendChild(row);
                });

            } catch (err) {
                console.error(err);
                statusEl.innerText = 'Ошибка загрузки';
                tbody.innerHTML = `<tr><td colspan="4" class="error">Не удалось получить данные с сервера. (${err.message})</td></tr>`;
            }
        }

        // Автозагрузка
        fetchEvents();
        setInterval(fetchEvents, 30000);
    </script>
</body>
</html>
